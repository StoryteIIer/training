<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<style>
  :root{
    --bg:#171a20; --bg2:#1e222b; --card:#232833; --line:#333a47;
    --chalk:#ecebe4; --chalk-dim:#a4a9b4; --chalk-faint:#6d7481;
    --oak:#cf9a4f; --oak-deep:#a97a34; --done:#7fb47c; --shift:#d7a34a; --drop:#5b616d; --danger:#c76b5a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  html,body{margin:0; overscroll-behavior:none}
  body{background:var(--bg); color:var(--chalk); font-family:var(--sans); -webkit-font-smoothing:antialiased;
    line-height:1.4; padding-bottom:env(safe-area-inset-bottom); touch-action:manipulation;}
  button,input,textarea,select,a,summary,label,.ex,.chip{touch-action:manipulation}
  input,textarea,button,select{font-family:inherit}
  .wrap{max-width:640px; margin:0 auto; min-height:100vh}

  header{position:sticky; top:0; z-index:20; background:linear-gradient(180deg,var(--bg) 82%,transparent);
    padding:calc(14px + env(safe-area-inset-top)) 16px 10px;}
  .brand{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
  .brand h1{font-size:15px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; margin:0}
  .brand h1 .mark{color:var(--oak)}
  .acct{font-family:var(--mono); font-size:11px; color:var(--chalk-faint); background:none; border:0; cursor:pointer; padding:0}
  .acct u{color:var(--oak-deep)}
  .tabs{display:flex; gap:6px; margin-top:12px; background:var(--bg2); padding:4px; border-radius:11px}
  .tabs button{flex:1; border:0; background:transparent; color:var(--chalk-dim); font-size:13px; font-weight:600;
    letter-spacing:.02em; padding:9px 8px; border-radius:8px; cursor:pointer;}
  .tabs button[aria-pressed="true"]{background:var(--card); color:var(--chalk); box-shadow:0 1px 0 #0003}

  main{padding:6px 16px 48px}

  .picker{display:flex; gap:6px; padding:12px 0 2px; overflow-x:auto; -webkit-overflow-scrolling:touch}
  .picker .plabel{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--chalk-faint); align-self:center; margin-right:2px; white-space:nowrap}
  .chip{flex:0 0 auto; border:1px solid var(--line); background:var(--bg2); color:var(--chalk-dim);
    border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap}
  .chip[aria-pressed="true"]{border-color:var(--oak-deep); background:var(--card); color:var(--chalk)}

  .rowline{display:flex; align-items:center; gap:10px; margin-top:12px}
  .rowline label{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--chalk-faint)}
  .fld{background:var(--card); border:1px solid var(--line); border-radius:10px; color:var(--chalk); font-size:15px; padding:10px 11px}
  .fld:focus{outline:2px solid var(--oak-deep); outline-offset:1px}
  input[type=date].fld{min-height:40px}

  .cycleline{font-family:var(--mono); font-size:11.5px; color:var(--chalk-faint); margin-top:10px}
  .cycleline b{color:var(--chalk-dim); font-weight:600}

  .days{display:flex; gap:6px; padding:12px 0 4px; overflow-x:auto}
  .days button{flex:1 0 auto; min-width:88px; border:1px solid var(--line); background:var(--bg2); color:var(--chalk-dim);
    border-radius:10px; padding:9px 6px; cursor:pointer; position:relative}
  .days button .d{font-family:var(--mono); font-size:11px; letter-spacing:.05em; display:block; white-space:nowrap}
  .days button .t{font-size:12px; font-weight:600; display:block; margin-top:2px; color:var(--chalk-faint)}
  .days button[aria-pressed="true"]{border-color:var(--oak-deep); background:var(--card)}
  .days button[aria-pressed="true"] .d{color:var(--oak)}
  .days button[aria-pressed="true"] .t{color:var(--chalk)}
  .days button .dot{position:absolute; top:6px; right:7px; width:6px; height:6px; border-radius:50%; background:var(--done)}

  .block{margin-top:18px}
  .block > .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--chalk-faint); display:flex; align-items:center; gap:10px; margin:0 2px 8px;}
  .block > .eyebrow::after{content:""; flex:1; height:1px; background:var(--line)}
  .empty{font-size:13px; color:var(--chalk-faint); font-style:italic; padding:12px 2px; border:1px dashed var(--line);
    border-radius:10px; text-align:center; margin-top:14px;}

  .ex{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 12px 12px 14px; margin-bottom:8px; position:relative; overflow:hidden}
  .ex::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent}
  .ex.logged::before{background:var(--done)}
  .ex .top{display:flex; align-items:flex-start; gap:10px}
  .ex .name{flex:1; text-align:left; background:none; border:0; color:var(--chalk); font-size:15px; font-weight:550; padding:0; cursor:pointer; line-height:1.3}
  .ex .name .chev{color:var(--chalk-faint); font-size:12px; margin-left:6px}
  .ex .note-has{color:var(--oak); font-size:11px; font-family:var(--mono)}
  .ex .note-body{font-size:12.5px; color:var(--chalk-dim); margin-top:7px; line-height:1.45}
  .entrline{display:flex; align-items:center; gap:8px; margin-top:9px; background:var(--bg2); border:1px solid var(--line); border-radius:9px; padding:8px 10px; cursor:pointer}
  .entrline .sum{flex:1; font-size:13.5px}
  .entrline .sum .tags{font-family:var(--mono); font-size:11px; color:var(--oak); margin-left:6px}
  .entrline .ed{font-family:var(--mono); font-size:11px; color:var(--chalk-faint)}
  .addlog{margin-top:9px; border:1px dashed var(--line); background:transparent; color:var(--oak); font-size:13px; font-weight:600; padding:9px; border-radius:9px; cursor:pointer; width:100%}
  .ex.skipped{opacity:.6}
  .ex.skipped::before{background:var(--drop)}
  .ex.moved::before{background:var(--shift)}
  .stbadge{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:3px 7px; border-radius:999px; align-self:flex-start; white-space:nowrap; margin-top:1px}
  .stbadge.skip{background:#2a2d33; color:var(--chalk-faint); border:1px solid var(--line)}
  .stbadge.move{background:#332a18; color:var(--shift); border:1px solid #5a4522}
  .markrow{display:flex; gap:8px; margin-top:10px}
  .markrow .markbtn{flex:1; border:1px solid var(--line); background:var(--bg2); color:var(--chalk-dim); font-size:12.5px; font-weight:600; padding:8px; border-radius:9px; cursor:pointer}
  .markrow .markbtn.on.skip{border-color:var(--drop); background:#2a2d33; color:var(--chalk)}
  .markrow .markbtn.on.move{border-color:#5a4522; background:#332a18; color:var(--shift)}

  .footer{margin:26px 2px 0; display:flex; gap:8px; flex-wrap:wrap}
  .footer button{font-size:12.5px; font-weight:600; color:var(--chalk-dim); background:var(--bg2); border:1px solid var(--line); border-radius:9px; padding:9px 12px; cursor:pointer}

  /* programs */
  .phead{display:flex; align-items:center; justify-content:space-between; margin:14px 2px 6px}
  .phead h2{font-size:14px; letter-spacing:.1em; text-transform:uppercase; color:var(--chalk-dim); margin:0; font-weight:600}
  .btn-primary{background:var(--oak); color:#231a0c; border:1px solid var(--oak); font-weight:600; font-size:13px; padding:9px 14px; border-radius:10px; cursor:pointer}
  .prog-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px}
  .prog-card .pc-top{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
  .prog-card .pc-name{font-size:16px; font-weight:600}
  .prog-card .pc-meta{font-family:var(--mono); font-size:11.5px; color:var(--chalk-faint); margin-top:3px}
  .toggle{border:1px solid var(--line); background:var(--bg2); color:var(--chalk-faint); font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:7px 12px; border-radius:999px; cursor:pointer; white-space:nowrap}
  .toggle[aria-pressed="true"]{border-color:var(--oak-deep); background:#2f2818; color:var(--oak)}
  .prog-card .pc-actions{display:flex; gap:8px; margin-top:12px}
  .prog-card .pc-actions button{font-size:12.5px; font-weight:600; border:1px solid var(--line); background:var(--bg2); color:var(--chalk-dim); padding:8px 12px; border-radius:9px; cursor:pointer}
  .prog-card .pc-actions .del{color:var(--danger); border-color:#4a3230}

  /* builder */
  .builder{padding-bottom:80px}
  .b-field{display:block; margin:14px 0 4px; font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--chalk-faint)}
  .b-input{width:100%; background:var(--card); border:1px solid var(--line); border-radius:10px; color:var(--chalk); font-size:15px; padding:11px 12px}
  .b-input:focus{outline:2px solid var(--oak-deep); outline-offset:1px}
  .b-sess{border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:12px; background:#1b1f27}
  .b-sess > .sh{display:flex; gap:8px; align-items:center}
  .b-sess > .sh .b-input{flex:1}
  .b-block{border:1px solid var(--line); border-radius:10px; padding:10px; margin-top:10px; background:var(--card)}
  .b-block > .bh{display:flex; gap:8px; align-items:center}
  .b-block > .bh .b-input{flex:1; font-weight:600}
  .b-item{margin-top:8px}
  .b-item .ir{display:flex; gap:8px; align-items:center}
  .b-item .ir .b-input{flex:1}
  .b-note{margin-top:6px}
  .b-note summary{font-family:var(--mono); font-size:11px; color:var(--chalk-dim); cursor:pointer; list-style:none; padding:2px 0 2px 2px}
  .b-note summary::-webkit-details-marker{display:none}
  .b-note summary::before{content:"\25B8 "; color:var(--chalk-faint)}
  .b-note[open] summary::before{content:"\25BE "}
  .b-note textarea{width:100%; margin-top:6px; min-height:70px; background:var(--bg2); border:1px solid var(--line); border-radius:8px; color:var(--chalk); font-size:14px; line-height:1.5; padding:9px; resize:vertical}
  .b-row2{display:flex; gap:8px; margin-top:6px}
  .b-row2 > div{flex:1}
  .iconbtn{flex:0 0 auto; width:34px; height:34px; border:1px solid var(--line); background:var(--bg2); color:var(--chalk-dim); border-radius:9px; font-size:17px; cursor:pointer; line-height:1}
  .iconbtn.danger{color:var(--danger)}
  .addbtn{margin-top:10px; width:100%; border:1px dashed var(--line); background:transparent; color:var(--chalk-dim); font-size:13px; font-weight:600; padding:10px; border-radius:10px; cursor:pointer}
  .b-bar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--bg2); border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .b-bar-inner{display:flex; gap:10px; max-width:640px; margin:0 auto; width:100%}
  .b-bar button{flex:1; font-size:14px; font-weight:600; padding:12px; border-radius:10px; cursor:pointer; border:1px solid var(--line)}
  .b-bar .save{background:var(--oak); color:#231a0c; border-color:var(--oak)}
  .b-bar .cancel{background:var(--card); color:var(--chalk)}

  /* segmented */
  .seg{display:inline-flex; gap:4px; background:var(--bg2); border:1px solid var(--line); border-radius:9px; padding:3px}
  .seg button{border:0; background:transparent; color:var(--chalk-dim); font-size:12.5px; font-weight:600; padding:6px 10px; border-radius:7px; cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--card); color:var(--chalk)}

  /* tag chips */
  .tagwrap{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  .tag{display:inline-flex; align-items:center; gap:6px; background:#2f2818; color:var(--oak); border:1px solid var(--oak-deep); border-radius:999px; padding:5px 6px 5px 11px; font-size:12.5px; font-weight:600}
  .tag button{border:0; background:none; color:var(--oak); font-size:14px; cursor:pointer; line-height:1; padding:0 2px}
  .tagsugg{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
  .tagsugg button{border:1px solid var(--line); background:var(--bg2); color:var(--chalk-dim); border-radius:999px; padding:5px 10px; font-size:12px; cursor:pointer}
  .preview{font-family:var(--mono); font-size:12px; margin-top:6px; color:var(--chalk-dim)}
  .preview.err{color:var(--danger)}
  .hint{font-family:var(--mono); font-size:11px; color:var(--chalk-faint); margin-top:4px}

  /* history */
  .h-controls{display:flex; flex-direction:column; gap:10px; margin-top:12px}
  .tagchecks{display:flex; flex-wrap:wrap; gap:6px}
  .tagcheck{border:1px solid var(--line); background:var(--bg2); color:var(--chalk-dim); border-radius:999px; padding:6px 11px; font-size:12.5px; font-weight:600; cursor:pointer; display:inline-flex; gap:7px; align-items:center}
  .tagcheck[aria-pressed="true"]{border-color:var(--oak-deep); background:var(--card); color:var(--chalk)}
  .tagcheck .sw{width:9px; height:9px; border-radius:50%}
  .chartbox{margin-top:14px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 10px 8px}
  .legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; padding:0 4px}
  .legend .li{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--chalk-dim)}
  .legend .li .sw{width:10px; height:10px; border-radius:50%}
  .h-list{margin-top:14px}
  .h-row{display:flex; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line); font-size:13.5px}
  .h-row .dt{font-family:var(--mono); color:var(--chalk-faint); font-size:12px; white-space:nowrap}
  .h-row .body{flex:1}
  .h-row .tg{font-family:var(--mono); font-size:11px; color:var(--oak)}

  /* sheet / modal */
  .scrim{position:fixed; inset:0; background:#000a; z-index:40; display:none; align-items:flex-end; justify-content:center}
  .scrim.open{display:flex}
  .sheet{width:100%; max-width:640px; background:var(--bg2); border:1px solid var(--line); border-radius:16px 16px 0 0; padding:16px 16px calc(18px + env(safe-area-inset-bottom)); max-height:90vh; overflow-y:auto}
  .sheet h2{font-size:16px; margin:2px 0 2px; font-weight:600}
  .sheet .ctx{font-family:var(--mono); font-size:11px; color:var(--chalk-faint); letter-spacing:.04em; margin-bottom:10px}
  .sheet label.fl{display:block; margin:12px 0 5px; font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--chalk-faint)}
  .sheet input.tin, .sheet textarea.tin{width:100%; background:var(--card); border:1px solid var(--line); border-radius:10px; color:var(--chalk); font-size:15px; padding:11px 12px}
  .sheet textarea.tin{min-height:64px; line-height:1.5; resize:vertical}
  .sheet input.tin:focus, .sheet textarea.tin:focus{outline:2px solid var(--oak-deep); outline-offset:1px}
  .frow{display:flex; gap:8px}
  .frow > div{flex:1}
  .sheet .btns{display:flex; gap:8px; margin-top:16px}
  .sheet .btns button{flex:1; font-size:14px; font-weight:600; padding:12px; border-radius:10px; cursor:pointer; border:1px solid var(--line)}
  .sheet .btns .save{background:var(--oak); color:#231a0c; border-color:var(--oak)}
  .sheet .btns .close{background:var(--card); color:var(--chalk)}
  .sheet .btns .del{background:transparent; color:var(--danger); border-color:#4a3230; flex:0 0 auto}

  /* auth / loading */
  .center{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px}
  .authcard{max-width:360px; text-align:center}
  .authcard .logo{font-size:44px; color:var(--oak); font-weight:700; line-height:1}
  .authcard h1{font-size:19px; margin:14px 0 6px; letter-spacing:.02em}
  .authcard p{color:var(--chalk-dim); font-size:14px; margin:0 0 22px; line-height:1.5}
  .gbtn{display:inline-flex; align-items:center; gap:10px; background:var(--chalk); color:#1a1a1a; border:0; border-radius:11px; font-size:15px; font-weight:600; padding:13px 20px; cursor:pointer}
  .gbtn .g{width:18px; height:18px; border-radius:50%; background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0 100%)}
  .muted{color:var(--chalk-faint); font-size:12px; margin-top:16px; line-height:1.5}
  .errbox{color:var(--danger); font-size:13px; margin-top:14px; line-height:1.5}

  .toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--card); border:1px solid var(--line); color:var(--chalk); font-size:13px; padding:10px 14px; border-radius:10px; z-index:60; opacity:0; transition:opacity .2s; pointer-events:none; box-shadow:0 8px 24px #0007; max-width:88%; text-align:center}
  .toast.show{opacity:1}
  button:focus-visible, .name:focus-visible, .chip:focus-visible{outline:2px solid var(--oak); outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
/* ================= DOM helper ================= */
function h(tag, props, ...kids){
  const e=document.createElement(tag);
  if(props) for(const k in props){
    const v=props[k];
    if(v==null || v===false) continue;
    if(k==="class") e.className=v;
    else if(k==="html") e.innerHTML=v;
    else if(k.startsWith("on") && typeof v==="function") e[k.toLowerCase()]=v;
    else if(k==="value") e.value=v;
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c=>{ if(c==null||c===false) return; e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}
const $ = s => document.querySelector(s);

let _uc=0; const uid = p => (p||"id")+"_"+Date.now().toString(36)+(_uc++).toString(36);

function parseDate(s){ return new Date(s+"T00:00:00"); }
function fmtShort(s){ return parseDate(s).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function dayDiff(a,b){ return Math.round((parseDate(a)-parseDate(b))/86400000); }
function addDaysStr(s,n){ const d=parseDate(s); d.setDate(d.getDate()+n); return todayStr(d); }

/* ================= seed program ================= */
function seedProgram(){
  const N = {

/* ================= firebase load + init ================= */
async function loadFirebase(){
  const base="https://www.gstatic.com/firebasejs/"+FBVER+"/";
  const [a,au,fs]=await Promise.all([ import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js") ]);
  FB=Object.assign({}, a, au, fs);
}
function isStandalone(){ return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone===true; }

async function boot(){
  render();
  try{ await loadFirebase(); }
  catch(e){ state.loadError="Couldn't load Firebase — check your connection and reload. ("+(e && e.message||e)+")"; render(); return; }
  try{
    app=FB.initializeApp(firebaseConfig);
    try{ db=FB.initializeFirestore(app,{ localCache: FB.persistentLocalCache({ tabManager: FB.persistentMultipleTabManager() }) }); }
    catch(e){ db=FB.getFirestore(app); }   // fallback if cache already initialised
    try{
      auth=FB.initializeAuth(app, {
        persistence:[FB.indexedDBLocalPersistence, FB.browserLocalPersistence],
        popupRedirectResolver: FB.browserPopupRedirectResolver
      });
    }catch(e){ auth=FB.getAuth(app); }
    FB.getRedirectResult(auth).catch(()=>{});
    FB.onAuthStateChanged(auth, onAuth);
    // safety net: never sit on the Loading screen if auth is slow to report
    setTimeout(()=>{ if(!state.ready){ state.ready=true; render(); } }, 7000);
  }catch(e){ state.loadError="Firebase init failed: "+(e && e.message||e); render(); }
}

function onAuth(u){
  state.ready=true;
  if(u){ state.user=u; state.uid=u.uid; startSubs(); }
  else { state.user=null; state.uid=null; stopSubs(); state.programs={}; state.allEntries=[]; }
  render();
}
async function doSignIn(){
  const provider=new FB.GoogleAuthProvider();
  state.loadError=null;
  try{
    await FB.signInWithPopup(auth, provider);   // works in Safari AND modern installed PWAs
  }catch(e){
    const code=(e && e.code)||"";
    if(code.indexOf("popup-blocked")>=0 || code.indexOf("operation-not-supported")>=0){
      // popup genuinely unavailable — fall back to a full-page redirect
      try{ await FB.signInWithRedirect(auth, provider); return; }
      catch(e2){ state.loadError="Sign-in failed: "+(e2 && e2.message||e2); render(); }
    } else if(code.indexOf("popup-closed")>=0 || code.indexOf("cancelled-popup")>=0){
      /* user dismissed the popup — no error to show */
    } else {
      state.loadError="Sign-in failed: "+(e && e.message||e); render();
    }
  }
}
function doSignOut(){ if(auth) FB.signOut(auth).catch(()=>{}); }

/* ---- firestore refs ---- */
const col = name => FB.collection(db, "users", state.uid, name);
const dref = (name,id) => FB.doc(db, "users", state.uid, name, id);

function startSubs(){
  stopSubs();
  unsub.push(FB.onSnapshot(col("programs"), snap=>{
    const m={}; snap.forEach(d=> m[d.id]=d.data());
    state.programs=m; state._programsLoaded=true;
    if(!state._migrated && snap.empty){ migrateLocal(); }
    render();
  }, err=>{ toast("Programs sync error"); }));
  unsub.push(FB.onSnapshot(col("logEntries"), snap=>{
    const arr=[]; snap.forEach(d=> arr.push(d.data()));
    arr.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    state.allEntries=arr; state._entriesLoaded=true; render();
  }, err=>{}));
  unsub.push(FB.onSnapshot(col("itemMarks"), snap=>{
    const m={}; snap.forEach(d=> m[d.id]=d.data());
    state.marks=m; render();
  }, err=>{}));
}
function stopSubs(){ unsub.forEach(fn=>{ try{fn();}catch(e){} }); unsub=[]; }

async function migrateLocal(){
  state._migrated=true;
  let local=null; try{ local=JSON.parse(localStorage.getItem("programs")||"null"); }catch(e){}
  const progs=(local && Object.keys(local).length) ? Object.values(local) : [seedProgram()];
  try{
    const batch=FB.writeBatch(db);
    progs.forEach(p=>{ if(p.cycleDays==null) p.cycleDays=7; if(!p.startDate) p.startDate=todayStr(); batch.set(dref("programs",p.id), p); });
    await batch.commit();
    toast(local? "Programs moved to the cloud" : "Starter program created");
  }catch(e){ toast("Setup failed: "+(e && e.message||e)); state._migrated=false; }
}

const sessName=(p,id)=>{ const s=p.sessions.find(x=>x.id===id); return s?s.name:id; };

/* ---- cycle ---- */
function cycleWindow(program, refStr){
  const len=Math.max(1, program.cycleDays||7);
  const start=program.startDate||todayStr();
  const diff=dayDiff(refStr, start);
  const k=Math.floor(diff/len);
  const cs=addDaysStr(start, k*len);
  const ce=addDaysStr(cs, len-1);
  return {start:cs, end:ce, len};
}
function cycleLabel(program){
  const len=program.cycleDays||7;
  const w=cycleWindow(program, todayStr());
  const kind = len%7===0 ? ((len/7)+"-week") : (len+"-day");
  return kind+" cycle · "+fmtShort(w.start)+" – "+fmtShort(w.end);
}
function loggedInCurrentCycle(program, dayId){
  const w=cycleWindow(program, todayStr());
  return state.allEntries.some(e=> e.programId===program.id && e.dayId===dayId && e.date>=w.start && e.date<=w.end);
}

/* ---- per-item skip/move marks (per current cycle) ---- */
function markId(program, dayId, itemId){
  const cs=cycleWindow(program, todayStr()).start;
  return program.id+"__"+dayId+"__"+itemId+"__"+cs;
}
function getMark(program, dayId, itemId){ const m=state.marks[markId(program,dayId,itemId)]; return m?m.status:"none"; }
async function toggleMark(program, dayId, itemId, status){
  const id=markId(program, dayId, itemId);
  const cur=state.marks[id]?state.marks[id].status:"none";
  try{
    if(cur===status){ await FB.deleteDoc(dref("itemMarks", id)); }
    else { await FB.setDoc(dref("itemMarks", id), { programId:program.id, dayId, itemId, status, cycleStart:cycleWindow(program,todayStr()).start, updatedAt:Date.now() }); }
  }catch(e){ toast("Couldn't update"); }
}

/* ================= sets shorthand parser =================
   space-separated tokens:  5   |   3x8 (3 sets of 8)   |   8@60 (8 reps @60)   |   3x8@60
   returns {sets:[{v,w}], error} ; w null means "use entry weight" */
function parseSets(text){
  const toks=(text||"").trim().split(/\s+/).filter(Boolean);
  if(!toks.length) return {sets:[], error:false, empty:true};
  const re=/^(?:(\d+)[xX])?(\d+(?:\.\d+)?)(?:@(\d+(?:\.\d+)?))?$/;
  const sets=[];
  for(const t of toks){
    const m=t.match(re);
    if(!m) return {sets:[], error:true, bad:t};
    const count=m[1]?parseInt(m[1],10):1;
    const val=parseFloat(m[2]);
    const w=m[3]!=null?parseFloat(m[3]):null;
    for(let i=0;i<count;i++) sets.push({v:val, w:w});
  }
  return {sets, error:false};
}
function previewText(text, mode){
  const p=parseSets(text);
  if(p.empty) return {txt:"", err:false};
  if(p.error) return {txt:"can't read \""+p.bad+"\"", err:true};
  const unit = mode==="hold" ? "s" : "";
  const parts=p.sets.map(s=> s.v+unit + (s.w!=null?("@"+s.w):""));
  return {txt:p.sets.length+" set"+(p.sets.length!==1?"s":"")+": "+parts.join(", "), err:false};
}
function setWeight(s, entry){ return s.w!=null ? s.w : (entry.weight||0); }

function summarize(e){
  const sets=e.sets||[];
  if(!sets.length) return "(no sets)";
  const vals=sets.map(s=>s.v);
  const same=vals.every(v=>v===vals[0]);
  const unit=e.mode==="hold"?"s":"";
  let rep = same ? (vals.length+"×"+vals[0]+unit) : vals.map(v=>v+unit).join(",");
  let wpart="";
  if(e.unit!=="bw"){
    const ws=sets.map(s=>setWeight(s,e));
    if(ws.some(w=>w>0)){ const wsame=ws.every(w=>w===ws[0]); wpart=" @ "+(wsame?ws[0]:ws.join("/"))+e.unit; }
  }
  return rep+wpart;
}

/* metric for plots */
function metricValue(e, metric){
  const sets=e.sets||[]; if(!sets.length) return null;
  if(metric==="best"){ return Math.max.apply(null, sets.map(s=>s.v)); }
  if(metric==="top"){ const ws=sets.map(s=>setWeight(s,e)); return Math.max.apply(null, ws); }
  // volume over first min(3, n)
  const k=Math.min(3, sets.length);
  let sum=0;
  for(let i=0;i<k;i++){ const s=sets[i]; const load=(e.unit==="bw" || setWeight(s,e)<=0)?1:setWeight(s,e); sum += (e.mode==="hold"? s.v : s.v*load); }
  return sum;
}
function metricUsedFewSets(e){ return (e.sets||[]).length<3; }

/* ================= entries ================= */
function lastEntryForName(name, excludeId){
  let best=null;
  for(const e of state.allEntries){
    if(e.name && name && e.name.toLowerCase()===name.toLowerCase() && e.id!==excludeId){
      if(!best || (e.createdAt||0)>(best.createdAt||0)) best=e;
    }
  }
  return best;
}
function entriesForDay(program, dayId, date){ return state.allEntries.filter(e=> e.programId===program.id && e.dayId===dayId && e.date===date); }
function saveEntry(e){ return FB.setDoc(dref("logEntries", e.id), e); }
function deleteEntry(id){ return FB.deleteDoc(dref("logEntries", id)); }
function allKnownTags(){ const s=new Set(); state.allEntries.forEach(e=> (e.tags||[]).forEach(t=>s.add(t))); return [...s].sort(); }
function distinctNames(){ const s=new Set(); state.allEntries.forEach(e=> e.name && s.add(e.name)); return [...s].sort((a,b)=>a.localeCompare(b)); }

function ensureLogSel(){
  const act=activePrograms();

/* ================= LOG ================= */
function renderLog(main){
  if(!state._programsLoaded){ main.appendChild(h("div",{class:"empty"},"Loading your programs…")); return; }
  const act=activePrograms();
  if(!act.length){ main.appendChild(h("div",{class:"empty"},"No active programs. Turn one on in the Programs tab.")); return; }
  ensureLogSel();
  if(act.length>1) main.appendChild(programPicker(act, state.logProgram, id=>{ state.logProgram=id; state.logSession=null; render(); }, "Logging"));
  const p=getProgram(state.logProgram);

  // session date
  main.appendChild(h("div",{class:"rowline"},
    h("label",{},"Session date"),
    h("input",{type:"date", class:"fld", value:state.sessionDate, onChange:e=>{ state.sessionDate=e.target.value||todayStr(); render(); }}),
    h("button",{class:"chip", onClick:()=>{ state.sessionDate=todayStr(); render(); }}, "today")));

  main.appendChild(h("div",{class:"cycleline"}, cycleLabel(p)));

  // day tabs with adherence dots
  const days=h("div",{class:"days"});
  p.sessions.forEach(s=>{
    const n=s.blocks.reduce((a,b)=>a+b.items.length,0);
    const dot=loggedInCurrentCycle(p, s.id);
    days.appendChild(h("button",{"aria-pressed":String(s.id===state.logSession), onClick:()=>{ state.logSession=s.id; render(); }},
      dot?h("span",{class:"dot"}):null,
      h("span",{class:"d"}, (s.name||"Day").toUpperCase()),
      h("span",{class:"t"}, n+" items")));
  });
  main.appendChild(days);

  const day=p.sessions.find(s=>s.id===state.logSession)||p.sessions[0];
  if(!day){ main.appendChild(h("div",{class:"empty"},"This program has no days.")); return; }
  const dayEntries=entriesForDay(p, day.id, state.sessionDate);

  day.blocks.forEach(b=>{
    const block=h("section",{class:"block"}, h("div",{class:"eyebrow"}, b.heading||"—"));
    b.items.forEach(item=>{
      const es=dayEntries.filter(e=> e.itemId===item.id);
      block.appendChild(exerciseCard(p, day, item, es));
    });
    main.appendChild(block);
  });

  // extras (entries not tied to a template item)
  const extra=dayEntries.filter(e=> !e.itemId || !findItem(p, e.itemId));
  const exblock=h("section",{class:"block"}, h("div",{class:"eyebrow"}, "Extra"));
  extra.forEach(e=> exblock.appendChild(extraCard(p, day, e)));
  exblock.appendChild(h("button",{class:"addlog", onClick:()=> openEntryForm(p, day, null, null)}, "+ Add exercise"));
  main.appendChild(exblock);
}

function exerciseCard(p, day, item, entries){
  const status = entries.length ? "done" : getMark(p, day.id, item.id);
  const cls = status==="done"?"logged": status==="skip"?"skipped": status==="move"?"moved":"";
  const card=h("div",{class:("ex "+cls).trim()});
  const note=item.note && item.note.trim();
  const badge = status==="skip"?h("span",{class:"stbadge skip"},"skipped"): status==="move"?h("span",{class:"stbadge move"},"moved"):null;
  const nameBtn=h("button",{class:"name", onClick:()=> toggleNote(card, item)}, item.name, note?h("span",{class:"note-has"}," note"):null, h("span",{class:"chev"},"›"));
  card.appendChild(h("div",{class:"top"}, nameBtn, badge));
  entries.forEach(e=>{
    card.appendChild(h("div",{class:"entrline", onClick:()=> openEntryForm(p, day, item, e)},
      h("div",{class:"sum"}, summarize(e), (e.tags&&e.tags.length)?h("span",{class:"tags"}, e.tags.join(" · ")):null),
      h("div",{class:"ed"}, "edit")));
  });
  if(!entries.length){
    card.appendChild(h("div",{class:"markrow"},
      h("button",{class:"markbtn"+(status==="skip"?" on skip":""), onClick:()=> toggleMark(p, day.id, item.id, "skip")}, status==="skip"?"Skipped ✓":"Skip"),
      h("button",{class:"markbtn"+(status==="move"?" on move":""), onClick:()=> toggleMark(p, day.id, item.id, "move")}, status==="move"?"Moved ✓":"Move")));
  }
  card.appendChild(h("button",{class:"addlog", onClick:()=> openEntryForm(p, day, item, null)}, entries.length?"+ Another set-entry":"+ Log"));
  return card;
}
function extraCard(p, day, e){
  const card=h("div",{class:"ex logged"});
  card.appendChild(h("div",{class:"top"}, h("button",{class:"name", onClick:()=> openEntryForm(p, day, null, e)}, e.name||"(unnamed)", h("span",{class:"chev"},"›"))));
  card.appendChild(h("div",{class:"entrline", onClick:()=> openEntryForm(p, day, null, e)},
    h("div",{class:"sum"}, summarize(e), (e.tags&&e.tags.length)?h("span",{class:"tags"}, e.tags.join(" · ")):null),
    h("div",{class:"ed"}, "edit")));
  return card;
}
function toggleNote(card, item){
  const ex=card.querySelector(".note-body");
  if(ex){ ex.remove(); return; }
  if(item.note && item.note.trim()) card.querySelector(".top").after(h("div",{class:"note-body"}, item.note));
}

/* ================= ENTRY FORM ================= */
function openEntryForm(program, day, item, existing){
  const name0 = existing ? existing.name : (item?item.name:"");
  const last = lastEntryForName(name0, existing?existing.id:null);
  const m = existing ? JSON.parse(JSON.stringify(existing)) : {
    id:uid("e"), programId:program.id, dayId:day.id, itemId:item?item.id:null,
    date: state.sessionDate, name:name0,
    tags: last?(last.tags?[...last.tags]:[]):[],
    mode: last?last.mode:"reps",
    setsText:"", sets:[],
    weight: last?(last.weight||0):0, unit: last?(last.unit||"kg"):"kg",
    rest: last?(last.rest||""):"", notes:""
  };
  if(!m.tags) m.tags=[];

  const sheet=$("#sheet-content"); sheet.innerHTML="";
  sheet.appendChild(h("h2",{}, existing?"Edit entry":"Log entry"));
  sheet.appendChild(h("div",{class:"ctx"}, (program.name||"")+"  ·  "+(day.name||"")));

  // name
  sheet.appendChild(h("label",{class:"fl"},"Exercise"));
  sheet.appendChild(h("input",{class:"tin", value:m.name, placeholder:"Exercise name", ...NOAC, oninput:e=>{ m.name=e.target.value; }}));

  // tags
  sheet.appendChild(h("label",{class:"fl"},"Variation tags"));
  const tagBox=h("div",{});
  sheet.appendChild(tagBox);
  function drawTags(){
    tagBox.innerHTML="";
    const wrap=h("div",{class:"tagwrap"});

const SERIES_COLORS=["#cf9a4f","#7fb47c","#6aa6d8","#b58cd6","#d98a6a","#5fb3ac","#d9c14a","#c77b9e"];
function renderHistory(main){
  const names=distinctNames();
  main.appendChild(h("div",{class:"phead"}, h("h2",{},"Exercise history"), null));
  if(!names.length){ main.appendChild(h("div",{class:"empty"},"No entries logged yet. Log something in the Log tab and it shows up here.")); return; }
  if(!state.hist.name || !names.includes(state.hist.name)) state.hist.name=names[0];

  const c=h("div",{class:"h-controls"});
  // name select
  c.appendChild(h("div",{class:"rowline"},
    h("label",{},"Exercise"),
    h("select",{class:"fld", style:"flex:1", onChange:e=>{ state.hist.name=e.target.value; state.hist.tags={}; render(); }},
      names.map(n=> h("option",{value:n, selected:n===state.hist.name?"selected":null}, n)))));

  // entries for this name
  const all=state.allEntries.filter(e=> e.name && e.name===state.hist.name);
  const dates=all.map(e=>e.date).sort();
  const earliest=dates[0]||todayStr();
  if(!state.hist.from) state.hist.from=earliest;

  // date range
  c.appendChild(h("div",{class:"rowline"},
    h("label",{},"From"),
    h("input",{type:"date", class:"fld", value:state.hist.from, onChange:e=>{ state.hist.from=e.target.value||earliest; render(); }}),
    h("label",{},"To"),
    h("input",{type:"date", class:"fld", value:state.hist.to, onChange:e=>{ state.hist.to=e.target.value||todayStr(); render(); }})));
  c.appendChild(h("div",{class:"rowline"},
    h("button",{class:"chip", onClick:()=>{ state.hist.from=earliest; state.hist.to=todayStr(); render(); }}, "all time")));

  main.appendChild(c);

  // filter by range
  const inRange=all.filter(e=> e.date>=state.hist.from && e.date<=state.hist.to);

  // tag combinations present in range
  const comboMap={};
  inRange.forEach(e=>{ const key=(e.tags&&e.tags.length)?[...e.tags].sort().join(" · "):"(no tags)"; (comboMap[key]=comboMap[key]||[]).push(e); });
  const combos=Object.keys(comboMap).sort();
  // default select all combos first time
  if(Object.keys(state.hist.tags).length===0){ combos.forEach(k=> state.hist.tags[k]=true); }
  // drop stale
  Object.keys(state.hist.tags).forEach(k=>{ if(!combos.includes(k)) delete state.hist.tags[k]; });

  main.appendChild(h("label",{class:"b-field", style:"margin-top:16px"},"Variations to plot"));
  const tc=h("div",{class:"tagchecks"});
  combos.forEach((k,i)=>{
    const on=!!state.hist.tags[k];
    tc.appendChild(h("button",{class:"tagcheck","aria-pressed":String(on), onClick:()=>{ state.hist.tags[k]=!state.hist.tags[k]; render(); }},
      h("span",{class:"sw", style:"background:"+SERIES_COLORS[i%SERIES_COLORS.length]}), k));
  });
  main.appendChild(tc);

  // metric
  main.appendChild(h("label",{class:"b-field", style:"margin-top:16px"},"Metric"));
  main.appendChild(seg([{v:"top",label:"Top-set weight"},{v:"best",label:"Best set"},{v:"vol",label:"Volume · first 3"}], state.hist.metric, v=>{ state.hist.metric=v; render(); }));

  // build series
  const metric = state.hist.metric==="vol"?"vol":state.hist.metric; // internal
  const series=[];
  combos.forEach((k,i)=>{
    if(!state.hist.tags[k]) return;
    const pts=[];
    // group combo entries by date, take best metric that day
    const byDate={};
    comboMap[k].forEach(e=>{ const val=metricValue(e, metric==="vol"?"vol":metric); if(val==null) return;
      const cur=byDate[e.date]; const few=metricUsedFewSets(e);
      if(!cur || val>cur.y) byDate[e.date]={y:val, hollow: metric==="vol"?few:false}; });
    Object.keys(byDate).sort().forEach(d=> pts.push({date:d, y:byDate[d].y, hollow:byDate[d].hollow}));
    if(pts.length) series.push({label:k, color:SERIES_COLORS[i%SERIES_COLORS.length], points:pts});
  });

  const metricLabel = state.hist.metric==="top"?"weight ("+(guessUnit(inRange))+")" : state.hist.metric==="best"?"best set" : "volume (first 3)";
  main.appendChild(chartBox(series, metricLabel));

  // detail list
  const list=h("div",{class:"h-list"});
  inRange.slice().sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0)).forEach(e=>{
    list.appendChild(h("div",{class:"h-row"},
      h("div",{class:"dt"}, fmtShort(e.date)),
      h("div",{class:"body"}, summarize(e), (e.tags&&e.tags.length)?h("span",{class:"tg"}, "  "+e.tags.join(" · ")):null, e.notes?h("div",{style:"color:var(--chalk-faint);font-size:12px;margin-top:2px"}, e.notes):null)));
  });
  if(inRange.length) main.appendChild(list);
  else main.appendChild(h("div",{class:"empty"},"No entries for this exercise in that date range."));
}
function guessUnit(entries){ const e=entries.find(x=>x.unit && x.unit!=="bw"); return e?e.unit:"kg"; }

/* ---- chart ---- */
function chartBox(series, yLabel){
  const box=h("div",{class:"chartbox"});
  if(!series.length){ box.appendChild(h("div",{class:"empty", style:"margin:6px 0 2px"},"Nothing selected to plot.")); return box; }
  box.appendChild(buildChartSVG(series, yLabel));
  const legend=h("div",{class:"legend"});
  series.forEach(s=> legend.appendChild(h("div",{class:"li"}, h("span",{class:"sw", style:"background:"+s.color}), s.label)));
  box.appendChild(legend);
  return box;
}
function buildChartSVG(series, yLabel){
  const W=340,H=210, mL=38,mR=10,mT=10,mB=26;
  const xs=[], ys=[];
  series.forEach(s=> s.points.forEach(p=>{ xs.push(parseDate(p.date).getTime()); ys.push(p.y); }));
  let xmin=Math.min.apply(null,xs), xmax=Math.max.apply(null,xs);
  let ymin=Math.min.apply(null,ys), ymax=Math.max.apply(null,ys);
  if(xmin===xmax){ xmin-=86400000; xmax+=86400000; }
  if(ymin===ymax){ ymin=Math.max(0,ymin-1); ymax=ymax+1; }
  const ypad=(ymax-ymin)*0.12; ymin=Math.max(0,ymin-ypad); ymax=ymax+ypad;
  const px=t=> mL + (t-xmin)/(xmax-xmin)*(W-mL-mR);
  const py=v=> H-mB - (v-ymin)/(ymax-ymin)*(H-mT-mB);
  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 "+W+" "+H); svg.setAttribute("width","100%"); svg.setAttribute("style","display:block");
  function el(n,at){ const x=document.createElementNS(NS,n); for(const k in at) x.setAttribute(k,at[k]); return x; }
  // y gridlines + labels
  const ticks=4;
  for(let i=0;i<=ticks;i++){
    const v=ymin+(ymax-ymin)*i/ticks; const y=py(v);
    svg.appendChild(el("line",{x1:mL,y1:y,x2:W-mR,y2:y,stroke:"#333a47","stroke-width":i===0?1:0.6}));
    const tx=el("text",{x:mL-5,y:y+3,"text-anchor":"end","font-size":9,fill:"#8b93a1","font-family":"ui-monospace,monospace"}); tx.textContent=fmtNum(v); svg.appendChild(tx);
  }
  // x ticks (dates)
  const xt=4;
  for(let i=0;i<=xt;i++){
    const t=xmin+(xmax-xmin)*i/xt; const x=px(t);
    const d=new Date(t); const s=todayStr(d);
    const tx=el("text",{x:x,y:H-mB+14,"text-anchor":"middle","font-size":9,fill:"#8b93a1","font-family":"ui-monospace,monospace"}); tx.textContent=fmtShort(s); svg.appendChild(tx);
  }
  // y axis label
  const yl=el("text",{x:12,y:mT+2,"text-anchor":"start","font-size":9,fill:"#6d7481","font-family":"ui-monospace,monospace"}); yl.textContent=yLabel; svg.appendChild(yl);
  // series
  series.forEach(s=>{
    const pts=s.points.slice().sort((a,b)=> a.date<b.date?-1:1);
    if(pts.length>1){
      let d=""; pts.forEach((p,i)=>{ d+=(i?"L":"M")+px(parseDate(p.date).getTime()).toFixed(1)+" "+py(p.y).toFixed(1)+" "; });
      svg.appendChild(el("path",{d:d,fill:"none",stroke:s.color,"stroke-width":1.8,"stroke-linejoin":"round"}));
    }
    pts.forEach(p=>{
      const cx=px(parseDate(p.date).getTime()), cy=py(p.y);
      const c=el("circle",{cx:cx,cy:cy,r:3.4, fill: p.hollow?"#232833":s.color, stroke:s.color, "stroke-width":1.6});
      const t=document.createElementNS(NS,"title"); t.textContent=fmtShort(p.date)+": "+fmtNum(p.y)+(p.hollow?" (fewer than 3 sets)":""); c.appendChild(t);
      svg.appendChild(c);
    });
  });
  return svg;
}
function fmtNum(v){ return (Math.round(v*10)/10).toString(); }

/* ---- export ---- */
function csvEscape(v){ v=(v==null?"":String(v)); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function buildJSON(){
  return JSON.stringify({ app:"training-sheet", exportedAt:new Date().toISOString(),
    programs:programList(), logEntries:state.allEntries.slice() }, null, 2);
}
function buildCSV(){
  const pn={}, dn={};
  programList().forEach(p=>{ pn[p.id]=p.name; p.sessions.forEach(s=> dn[p.id+"/"+s.id]=s.name); });
  const rows=[["date","exercise","tags","mode","sets","weight","unit","rest","program","day","notes"]];
  state.allEntries.slice().sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0)).forEach(e=>{
    rows.push([ e.date, e.name, (e.tags||[]).join("|"), e.mode, e.setsText||summarize(e),
      (e.unit==="bw"?"":e.weight), e.unit, (e.rest===""||e.rest==null?"":e.rest),
      pn[e.programId]||"", dn[e.programId+"/"+e.dayId]||"", e.notes||"" ]);
  });
  return rows.map(r=> r.map(csvEscape).join(",")).join("\n");
}
async function exportData(kind){
  const stamp=todayStr();
  const filename = kind==="csv" ? ("training-log-"+stamp+".csv") : ("training-sheet-backup-"+stamp+".json");
  const text = kind==="csv" ? buildCSV() : buildJSON();
  const mime = kind==="csv" ? "text/csv" : "application/json";
  // Prefer the share sheet on iOS (lets you Save to Files / Mail / Notes)
  if(navigator.canShare){
    try{
      const file=new File([text], filename, {type:mime});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:filename}); return; }
    }catch(e){ if(e && e.name==="AbortError") return; /* else fall through to download */ }
  }
  try{
    const blob=new Blob([text],{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    toast("Exported "+filename);
  }catch(e){ toast("Export failed"); }
}
async function delProgram(id){
  const p=getProgram(id); if(!p) return;
  if(!confirm('Delete "'+(p.name||"Untitled")+'"? Logged entries for it stay in History unless you remove them separately. This cannot be undone.')) return;
  try{ await FB.deleteDoc(dref("programs",id)); if(state.logProgram===id) state.logProgram=null; toast("Program deleted"); }catch(e){ toast("Delete failed"); }
}

async function saveBuilder(){
  const d=state.builder.data;
  if(!d.name.trim()) d.name="Untitled program";

  catch(e){ toast("Save failed: "+(e && e.message||e)); }
}

/* ================= sheet + toast ================= */
function openSheet(){ $("#scrim").classList.add("open"); }
function closeSheet(){ $("#scrim").classList.remove("open"); $("#sheet-content").innerHTML=""; }
$("#scrim").onclick=e=>{ if(e.target===$("#scrim")) closeSheet(); };
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1800); }

/* ================= boot ================= */
boot();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
</script>
</body>
